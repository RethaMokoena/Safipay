services:

  frontend:
    image: node:20-alpine

    container_name: safipay-frontend

    working_dir: /app

    ports:
      - "4200:4200"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      NG_CLI_ANALYTICS: "false"

    command: >
      sh -c "
       if [ ! -d node_modules/@angular ]; then npm install; fi &&
      npx ng serve
      --host 0.0.0.0
      --port 4200
      --poll=1000
      "

volumes:
  frontend_node_modules: