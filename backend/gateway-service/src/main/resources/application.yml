server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "http://localhost:*"
              - "http://127.0.0.1:4200"  # Added for safety
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        # ── Public auth routes (no JWT required) ────────────────
        - id: user-service-auth
          uri: http://user-service:8081  # ✅ Using service name
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # ── Protected routes ─────────────────────────────────────
        - id: user-service-admin
          uri: http://user-service:8081  # ✅ Using service name
          predicates:
            - Path=/api/admin/users/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: wallet-service
          uri: http://wallet-service:8082  # ✅ Using service name
          predicates:
            - Path=/api/wallets/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: wallet-service-admin
          uri: http://wallet-service:8082  # ✅ Using service name
          predicates:
            - Path=/api/admin/wallets/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: payment-service
          uri: http://payment-service:8083  # ✅ Using service name
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: stokvel-service
          uri: http://stokvel-service:8084  # ✅ Using service name
          predicates:
            - Path=/api/stokvels/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: ledger-service
          uri: http://ledger-service:8085  # ✅ Using service name
          predicates:
            - Path=/api/ledger/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: merchant-service
          uri: http://merchant-service:8086  # ✅ Using service name
          predicates:
            - Path=/api/merchants/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: fraud-service
          uri: http://fraud-service:8087  # ✅ Using service name
          predicates:
            - Path=/api/fraud/**
          filters:
            - StripPrefix=0
            - AuthFilter

        - id: webhook-service
          uri: http://webhook-service:8088  # ✅ Using service name
          predicates:
            - Path=/api/webhooks/**
          filters:
            - StripPrefix=0
            - AuthFilter
          
      
        - id: ai-service
          uri: http://ai-service:8090
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0
            - AuthFilter
jwt:
  secret: safipay-super-secret-key-for-jwt-signing-must-be-256-bits-long

logging:
  level:
    com.safipay.gateway: DEBUG
    org.springframework.cloud.gateway: INFO